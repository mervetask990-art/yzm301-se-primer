      </span>

<!-- Primary Action Button -->
<button class="w-full min-h-[52px] h-[52px] bg-primary text-on-primary font-code-md text-[14px] font-bold rounded-[14px] flex items-center justify-center gap-2 transition-all duration-200 active:bg-primary-container shadow-md" id="start-shift-btn" type="button">
<span>Nöbete başla</span>
<span class="material-symbols-outlined text-[20px]">east</span>
</button>
<div class="flex items-center justify-center gap-1.5 text-center mt-1">
<span class="font-label-sm text-label-sm text-outline font-normal">İstediğin an ayarlarından güncelleyebilirsin.</span>
</div>

<script>
  (function () {
    const chips = document.querySelectorAll('.chip-option');
    const startBtn = document.getElementById('start-shift-btn');

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const group = chip.getAttribute('data-group');
        const siblings = document.querySelectorAll(`.chip-option[data-group="${group}"]`);

        // Deselect all within group
        siblings.forEach(s => {
          s.classList.remove('is-selected', 'bg-surface-container-highest', 'text-primary', 'font-semibold', 'shadow-inner');
          s.classList.add('bg-surface-container-low', 'text-on-surface-variant');
          
          // Revert icon to tiny dot
          const iconOrDot = s.firstElementChild;
          if (iconOrDot) {
            iconOrDot.outerHTML = '<span class="chip-indicator w-2 h-2 rounded-full bg-outline-variant"></span>';
          }
          const textSpan = s.lastElementChild;
          if (textSpan) {
            textSpan.className = '';
          }
        });

        // Select clicked chip
        chip.classList.add('is-selected', 'bg-surface-container-highest', 'text-primary', 'font-semibold', 'shadow-inner');
        chip.classList.remove('bg-surface-container-low', 'text-on-surface-variant');

        const indicator = chip.querySelector('.chip-indicator');
        if (indicator) {
          indicator.outerHTML = '<span class="material-symbols-outlined text-[16px] text-primary">check_circle</span>';
        }
        const textSpan = chip.lastElementChild;
        if (textSpan) {
          textSpan.className = 'text-on-surface';
        }
      });
    });

    if (startBtn) {
      startBtn.addEventListener('click', () => {
        startBtn.classList.add('scale-95');
        setTimeout(() => {
          startBtn.classList.remove('scale-95');
        }, 150);
      });
    }
  })();
</script></main></body></html>
